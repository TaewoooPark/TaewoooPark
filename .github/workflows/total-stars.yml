name: Update total stars badge

on:
  schedule:
    # Daily at 06:10 KST (UTC 21:10).
    - cron: '10 21 * * *'
  workflow_dispatch:

concurrency:
  group: update-total-stars
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute combined star total
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const USER = 'TaewoooPark';
            // Repos owned elsewhere (e.g. the OPTIMETA org) to fold into the personal total.
            const EXTRA = ['OPTIMETA/PAIDEIA', 'OPTIMETA/PAIDEIA-codex', 'OPTIMETA/PAIDEIA-Alt'];

            let total = 0;
            // Personal public repos, forks excluded (matches the old ?affiliations=OWNER badge).
            const owned = await github.paginate(github.rest.repos.listForUser, { username: USER, per_page: 100 });
            for (const r of owned) if (!r.fork) total += r.stargazers_count;

            // Fold in the explicitly listed external repos.
            for (const full of EXTRA) {
              const [owner, repo] = full.split('/');
              const { data } = await github.rest.repos.get({ owner, repo });
              total += data.stargazers_count;
            }

            const badge = {
              schemaVersion: 1,
              label: 'STARS',
              message: String(total),
              color: '333333',
              labelColor: '000000',
            };
            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/total-stars.json', JSON.stringify(badge) + '\n');
            core.info(`total stars = ${total}`);

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/total-stars.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh total stars badge"
          git push
