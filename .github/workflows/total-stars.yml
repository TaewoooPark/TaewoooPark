name: Update total stars badge

on:
  schedule:
    # Daily at 06:10 KST (UTC 21:10).
    - cron: '10 21 * * *'
  workflow_dispatch:

concurrency:
  group: update-total-stars
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute combined star total
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const USER = 'TaewoooPark';
            const ORGS = ['OPTIMETA'];

            let total = 0;
            let repoCount = 0;

            const addRepos = (label, repos) => {
              let subtotal = 0;
              for (const repo of repos) {
                subtotal += repo.stargazers_count;
              }
              repoCount += repos.length;
              total += subtotal;
              core.info(`${label}: ${repos.length} public repos, ${subtotal} stars`);
            };

            // Public repositories owned by the user. Forks are included because
            // this badge is the all-repository star total, not the featured index.
            const owned = await github.paginate(github.rest.repos.listForUser, { username: USER, per_page: 100 });
            addRepos(USER, owned);

            // Public repositories owned by OPTIMETA and any future orgs listed above.
            for (const org of ORGS) {
              const repos = await github.paginate(github.rest.repos.listForOrg, {
                org,
                type: 'public',
                per_page: 100,
              });
              addRepos(org, repos);
            }

            const badge = {
              schemaVersion: 1,
              label: 'STARS',
              message: String(total),
              color: '333333',
              labelColor: '000000',
            };
            const badgePath = 'assets/total-stars.json';
            const badgeJson = JSON.stringify(badge) + '\n';
            const previousBadgeJson = fs.existsSync(badgePath) ? fs.readFileSync(badgePath, 'utf8') : '';
            const badgeChanged = previousBadgeJson !== badgeJson;

            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync(badgePath, badgeJson);

            if (badgeChanged && fs.existsSync('README.md')) {
              const cacheKey = new Date().toISOString()
                .replace(/[-:]/g, '')
                .replace(/\.\d{3}Z$/, 'Z');
              const readme = fs.readFileSync('README.md', 'utf8');
              const nextReadme = readme.replace(
                /assets%2Ftotal-stars\.json%3Fv%3D[^&"]+/,
                `assets%2Ftotal-stars.json%3Fv%3D${cacheKey}`,
              );
              if (nextReadme !== readme) {
                fs.writeFileSync('README.md', nextReadme);
                core.info(`updated README total-stars cache key to ${cacheKey}`);
              }
            }
            core.info(`total stars = ${total} across ${repoCount} public repos`);

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/total-stars.json README.md
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh total stars badge"
          git push
