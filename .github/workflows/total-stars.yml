name: Update total stars badge

on:
  schedule:
    # Daily at 06:10 KST (UTC 21:10).
    - cron: '10 21 * * *'
  workflow_dispatch:

concurrency:
  group: update-total-stars
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute combined star total
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const USER = 'TaewoooPark';
            const ORGS = ['OPTIMETA'];

            let total = 0;
            let repoCount = 0;

            const addRepos = (label, repos) => {
              let subtotal = 0;
              for (const repo of repos) {
                subtotal += repo.stargazers_count;
              }
              repoCount += repos.length;
              total += subtotal;
              core.info(`${label}: ${repos.length} public repos, ${subtotal} stars`);
            };

            // Public repositories owned by the user. Forks are included because
            // this badge is the all-repository star total, not the featured index.
            const owned = await github.paginate(github.rest.repos.listForUser, { username: USER, per_page: 100 });
            addRepos(USER, owned);

            // Public repositories owned by OPTIMETA and any future orgs listed above.
            for (const org of ORGS) {
              const repos = await github.paginate(github.rest.repos.listForOrg, {
                org,
                type: 'public',
                per_page: 100,
              });
              addRepos(org, repos);
            }

            const badge = {
              schemaVersion: 1,
              label: 'STARS',
              message: String(total),
              color: '333333',
              labelColor: '000000',
            };
            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/total-stars.json', JSON.stringify(badge) + '\n');
            core.info(`total stars = ${total} across ${repoCount} public repos`);

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/total-stars.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh total stars badge"
          git push
