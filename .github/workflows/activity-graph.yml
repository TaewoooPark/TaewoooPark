name: Update contribution activity graph

on:
  schedule:
    # Daily at 06:20 KST (UTC 21:20).
    - cron: '20 21 * * *'
  workflow_dispatch:

concurrency:
  group: update-profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render public contribution activity
        run: |
          python scripts/generate_activity_graph.py --username TaewoooPark --output assets/activity-graph.svg
          python scripts/refresh_asset_cache.py assets/activity-graph.svg

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg README.md
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh contribution activity graph"
          git pull --rebase origin main
          git push
